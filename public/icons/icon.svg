<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2cfb0"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#9d7e56"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Elegant Atelier Monogram / Sofa Emblem -->
  <g transform="translate(256, 230)" text-anchor="middle">
    <text font-family="'Playfair Display', Georgia, serif" font-size="160" font-weight="700" fill="url(#gold)" y="50" letter-spacing="2">P</text>
  </g>
  <!-- Architectural baseline text -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#e8dfd2" text-anchor="middle" letter-spacing="9">PRADEEP</text>
  <text x="256" y="405" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a79f93" text-anchor="middle" letter-spacing="7">ATELIER</text>
</svg>
